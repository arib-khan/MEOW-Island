<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 240px; height: 320px; background: #101820; }
  .box { width: 240px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: sans-serif; }
  .big { font-size: 40px; font-weight: 800; color: #FFD166; line-height: 1.1; }
  .small { margin-top: 16px; font-size: 16px; color: #9FB3C8; }
  .bar { width: 120px; height: 6px; margin-top: 22px; border-radius: 3px; background: #EF476F; }
</style></head>
<body><div class="box"><div class="big">Do not<br>disturb</div><div class="bar"></div><div class="small">Back in 30 minutes</div></div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=240, initial-scale=1">
<style>
  /* Designed for the display: 240 x 320 CSS pixels. Flat colours and simple shapes convert best. */
  html, body { margin: 0; width: 240px; height: 320px; overflow: hidden; background: #0E0B16; color: #F4F0FA; font-family: sans-serif; }
  .wrap { box-sizing: border-box; width: 240px; height: 320px; padding: 28px 20px; text-align: center; border: 3px solid #7C4DFF; border-radius: 22px; }
  .cat { font-size: 54px; margin-top: 8px; }
  h1 { font-size: 30px; margin: 14px 0 6px; color: #D070F2; }
  p { font-size: 16px; margin: 4px 0; color: #A79DBA; }
  .pill { display: inline-block; margin-top: 22px; padding: 8px 18px; border-radius: 20px; background: #7C4DFF; color: #fff; font-weight: bold; font-size: 15px; }
</style></head>
<body><div class="wrap">
  <div class="cat">&#128049;</div>
  <h1>Your Name</h1>
  <p>Designer &amp; cat person</p>
  <p>hello@example.com</p>
  <div class="pill">Meow Island</div>
</div></body></html>
